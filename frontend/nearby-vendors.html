
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nearby Vendors | AI Architecture Platform</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#172554;color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header a{color:white;text-decoration:none}
main{max-width:1100px;margin:35px auto;padding:0 20px}
.panel{background:white;padding:25px;border-radius:14px;box-shadow:0 5px 22px #0000000b;margin-bottom:22px}
h1{margin:0 0 8px;font-size:27px}
p{color:#64748b;line-height:1.6}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;align-items:end}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:8px}
input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px}
button,.btn{background:#2563eb;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{background:#1d4ed8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.vendor{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:22px}
.vendor h3{margin-top:0}
.tag{display:inline-block;background:#dbeafe;color:#1d4ed8;padding:6px 10px;border-radius:20px;font-size:13px}
#message{margin:15px 0;color:#334155}
</style>
</head>
<body>
<header>
  <div><strong>AI Architecture Platform</strong><br><small>Nearby Vendor Finder</small></div>
  <a href="/dashboard">← Back to Dashboard</a>
</header>

<main>
  <section class="panel">
    <h1>Find Nearby Vendors</h1>
    <p>Search for local merchants using location coordinates and an optional product category.</p>

    <form id="vendorForm">
      <div>
        <label for="latitude">Latitude</label>
        <input id="latitude" type="number" step="any" value="22.7196" required>
      </div>
      <div>
        <label for="longitude">Longitude</label>
        <input id="longitude" type="number" step="any" value="75.8577" required>
      </div>
      <div>
        <label for="radius">Radius (km)</label>
        <input id="radius" type="number" min="1" max="500" value="20" required>
      </div>
      <div>
        <label for="category">Category (optional)</label>
        <input id="category" type="text" placeholder="e.g. flooring">
      </div>
      <button type="submit">Search Vendors</button>
    </form>
    <div id="message">Enter your search details and click Search Vendors.</div>
  </section>

  <section>
    <div id="summary"></div>
    <div id="vendors" class="grid"></div>
  </section>
</main>

<script>
const form = document.getElementById("vendorForm");
const message = document.getElementById("message");
const vendorsBox = document.getElementById("vendors");
const summary = document.getElementById("summary");

form.addEventListener("submit", async function(event) {
  event.preventDefault();
  vendorsBox.innerHTML = "";
  summary.innerHTML = "";
  message.textContent = "Searching nearby vendors...";

  const latitude = document.getElementById("latitude").value;
  const longitude = document.getElementById("longitude").value;
  const radius = document.getElementById("radius").value;
  const category = document.getElementById("category").value.trim();

  const params = new URLSearchParams({latitude, longitude, radius});
  if (category) params.set("category", category);

  const response = await fetch("/vendor/nearby?" + params.toString());
  const data = await response.json();

  if (!response.ok) {
    message.textContent = data.detail || "Unable to load vendors.";
    return;
  }

  const vendors = data.vendors || [];
  summary.innerHTML = "<section class='panel'><strong>Vendors found: " + (data.count ?? vendors.length) + "</strong></section>";

  if (vendors.length === 0) {
    message.textContent = "No vendors found for these search details.";
    return;
  }

  message.textContent = "Vendor search completed successfully.";

  vendors.forEach(function(vendor) {
    const card = document.createElement("article");
    card.className = "vendor";

    const name = document.createElement("h3");
    name.textContent = vendor.business_name || "Local Merchant";

    const location = document.createElement("p");
    location.textContent = "Location: " + (vendor.location || "Not available");

    const distance = document.createElement("p");
    distance.textContent = "Distance: " + (vendor.distance_km ?? "N/A") + " km";

    const badge = document.createElement("span");
    badge.className = "tag";
    badge.textContent = "Merchant ID: " + vendor.merchant_id;

    const productsTitle = document.createElement("h4");
    productsTitle.textContent = "Products";

    const products = document.createElement("p");
    products.textContent = Array.isArray(vendor.products) && vendor.products.length
      ? vendor.products.map(p => typeof p === "string" ? p : (p.name || p.product_name || "Product")).join(", ")
      : "No products listed in this vendor response.";

    card.append(name, location, distance, badge, productsTitle, products);
    vendorsBox.appendChild(card);
  });
});
</script>
</body>
</html>
