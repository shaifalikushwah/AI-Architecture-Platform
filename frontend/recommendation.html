<!DOCTYPE html>
<html>

<head>

<title>AI Product Recommendation</title>

<style>

body {
    font-family: Arial;
    margin: 0;
    background: #f5f6fa;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

.search {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #ddd;
    margin-bottom: 20px;
}

input {
    padding: 12px;
    width: 60%;
    border-radius: 7px;
    border: 1px solid #ccc;
}

button {
    padding: 12px;
    border-radius: 7px;
    border: 0;
    background: #111827;
    color: white;
    cursor: pointer;
}

.products {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #ddd;
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
}

.price {
    font-size: 22px;
    font-weight: bold;
}

.badge {
    display: inline-block;
    padding: 5px 9px;
    background: #eee;
    border-radius: 15px;
}

</style>

</head>

<body>


<div class="container">


<h1>
🔍 Product Recommendation
</h1>


<div class="search">

<input
    id="objectName"
    placeholder="flooring, chair, sofa, light..."
>

<button onclick="findProducts()">
Find Products
</button>

</div>


<div id="message"></div>


<div
    id="products"
    class="products"
></div>


</div>


<script>


async function findProducts() {

    const objectName =
        document
        .getElementById("objectName")
        .value
        .trim();


    if (!objectName) {

        document
        .getElementById("message")
        .innerText =
        "Enter an object name";

        return;
    }


    document
    .getElementById("message")
    .innerText =
    "Searching...";


    const response =
        await fetch(
            "/recommendation/detect-and-recommend?object_name="
            +
            encodeURIComponent(
                objectName
            ),
            {
                method: "POST"
            }
        );


    const data =
        await response.json();


    const container =
        document
        .getElementById("products");


    container.innerHTML = "";


    if (
        !data.products ||
        data.products.length === 0
    ) {

        document
        .getElementById("message")
        .innerText =
        "No matching products found";

        return;
    }


    document
    .getElementById("message")
    .innerText =
    data.matched_products
    +
    " products found for "
    +
    data.detected_object;


    data.products.forEach(
        product => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const image =
                product.image_url
                ?
                `<img src="${product.image_url}"
                onerror="this.style.display='none'">`
                :
                "";


            card.innerHTML = `

                ${image}

                <h2>
                    ${product.product_name}
                </h2>

                <p>
                    <span class="badge">
                        ${product.category}
                    </span>
                </p>

                <p class="price">
                    ₹${product.price}
                </p>

                <p>
                    Stock:
                    ${product.stock}
                </p>

                <p>
                    Merchant:
                    ${product.business_name}
                </p>

                <p>
                    Location:
                    ${product.location}
                </p>

                <button
                    onclick="
                    negotiate(
                        ${product.product_id},
                        ${product.price}
                    )"
                >
                    Negotiate Price
                </button>

            `;


            container.appendChild(
                card
            );

        }
    );

}


async function negotiate(
    productId,
    price
) {

    const offer =
        prompt(
            "Product Price: ₹"
            +
            price
            +
            "\nEnter your offer:"
        );


    if (!offer) {
        return;
    }


    const response =
        await fetch(
            "/negotiation/offer?"
            +
            "product_id="
            +
            productId
            +
            "&client_id=1"
            +
            "&offered_price="
            +
            encodeURIComponent(
                offer
            ),
            {
                method: "POST"
            }
        );


    const data =
        await response.json();


    alert(
        "Offer sent successfully!\n"
        +
        "Negotiation ID: "
        +
        data.negotiation_id
        +
        "\nOffered Price: ₹"
        +
        data.offered_price
    );

}


</script>

</body>

</html>
